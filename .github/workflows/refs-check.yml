name: Reference drift check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check generated references
        run: uv run tools/build-refs.py --check
